<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />
  <title>No signal · Shrabya Bhattarai</title>
  <!-- GitHub Pages serves this page at any missing path, so every link here is root-relative -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Same brightness setup as index.html, so this page matches the fader setting
    window.applyBrightness = (value) => {
      const t = value / 100, r = document.documentElement.style;
      const tb = .5 + .5 * Math.tanh((t - .5) * 3) / Math.tanh(1.5);
      r.setProperty('--t', t);
      r.setProperty('--tb', tb);
      r.setProperty('--tf', t > .5 ? 1 : 0);
      r.setProperty('--m', 1 - Math.abs(2 * tb - 1));
      r.colorScheme = t > .5 ? 'dark' : 'light';
    };
    try {
      const b = localStorage.getItem('brightness');
      if (b !== null) applyBrightness(Number(b));
    } catch (e) {}
  </script>
  <style>
    .nosignal {
      min-height: 100dvh; max-width: 40rem; margin: 0 auto; padding: 3rem var(--gutter);
      display: flex; flex-direction: column; justify-content: center; gap: 1rem;
    }
    .nosignal__home { position: absolute; top: 1.25rem; left: var(--gutter); }
    .nosignal__screen {
      position: relative; aspect-ratio: 5 / 3; margin-bottom: 1rem; overflow: hidden;
      border: 1px solid var(--rule); border-radius: 8px; background-color: var(--paper-raised);
      /* 10 by 6 divisions, like a scope graticule */
      background-image:
        linear-gradient(var(--rule) 1px, transparent 1px),
        linear-gradient(90deg, var(--rule) 1px, transparent 1px);
      background-size: 10% calc(100% / 6);
      background-position: -1px -1px;
    }
    .nosignal__screen svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .nosignal__trace { fill: none; stroke: var(--c-green); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .nosignal__label, .nosignal__trig {
      position: absolute; font-family: var(--mono); font-size: .72rem; color: var(--muted);
      padding: 0 .3rem; background: var(--paper-raised); border-radius: 3px;
    }
    .nosignal__label { top: .6rem; left: .6rem; }
    .nosignal__trig { top: .6rem; right: .6rem; color: var(--c-red); }
    /* The sweep: a bright spot runs along the flat line, like a scope with nothing on its input */
    .nosignal__beam {
      position: absolute; top: 50%; left: 0; width: 18%; height: 6px; transform: translate(-100%, -50%);
      background: linear-gradient(90deg, transparent, var(--c-green));
      border-radius: 3px; opacity: .55; filter: blur(1px);
    }
    @media (prefers-reduced-motion: no-preference) {
      .nosignal__beam { animation: sweep 2.4s linear infinite; }
      .nosignal__trig { animation: waiting 1.2s step-end infinite; }
    }
    @keyframes sweep { to { left: 118%; } }
    @keyframes waiting { 50% { opacity: .35; } }
    .nosignal__code { font-family: var(--mono); font-size: .85rem; color: var(--muted); }
    .nosignal h1 { font-size: clamp(2.75rem, 9vw, 4.5rem); font-weight: 850; font-variation-settings: 'wdth' 125; letter-spacing: -.02em; line-height: .95; }
    .nosignal p { color: var(--muted); font-size: 1.1rem; max-width: 32rem; }
    .nosignal a.back {
      align-self: flex-start; margin-top: .5rem; font-weight: 700;
      text-decoration-color: var(--rule); text-decoration-thickness: 2px; text-underline-offset: .3em;
    }
    .nosignal a.back:hover { text-decoration-color: currentColor; }
  </style>
</head>
<body>
  <main class="nosignal">
    <a class="wordmark nosignal__home" href="/">Shrabya Bhattarai</a>
    <div class="nosignal__screen" aria-hidden="true">
      <svg viewBox="0 0 100 60" preserveAspectRatio="none">
        <path class="nosignal__trace" d="M0 30h100" />
      </svg>
      <span class="nosignal__beam"></span>
      <span class="nosignal__label">CH1 · 2 V/div · 5 ms/div</span>
      <span class="nosignal__trig">Trig'd? Waiting…</span>
    </div>
    <p class="nosignal__code">Error 404</p>
    <h1>No signal</h1>
    <p>Nothing is connected at this address. The page may have moved, or the link has a typo.</p>
    <a class="back" href="/">Back to the home page</a>
  </main>
</body>
</html>
